<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>เข้าสู่ระบบ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-mode="login">
    <main class="card auth-card">
      <p class="eyebrow">PARKLY</p>
      <h1>เข้าสู่ระบบ</h1>
      <p class="subtitle">จองที่จอดรถได้ในไม่กี่ขั้นตอน</p>
      <form id="auth-form" class="auth-form">
        <label
          >อีเมล<input
            type="email"
            name="email"
            autocomplete="email"
            required /></label
        ><label
          >รหัสผ่าน<input
            type="password"
            name="password"
            autocomplete="current-password"
            required /></label
        ><button type="submit">เข้าสู่ระบบ</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <p>
        ยังไม่มีบัญชี? <a class="auth-link" href="register.html">สมัครสมาชิก</a>
      </p>
      <p><a class="auth-link" href="/landlord/login.html">สำหรับผู้ให้เช่าลานจอด →</a></p>
    </main>
    <script src="auth.js"></script>
  </body>
</html>
