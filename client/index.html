<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Board</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">FULL-STACK DEMO</p>
      <h1>Task Board</h1>
      <p class="subtitle">ตัวอย่างหน้าเว็บที่คุยกับ REST API</p>
      <form id="task-form">
        <label class="sr-only" for="task-title">ชื่องาน</label>
        <input id="task-title" name="title" placeholder="เพิ่มงานใหม่..." autocomplete="off" required />
        <button type="submit">เพิ่มงาน</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <ul id="task-list" aria-label="รายการงาน"></ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
